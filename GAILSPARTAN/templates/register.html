{% extends "base.html" %}
{% block title %}Create account · GAILSPARTAN{% endblock %}
{% block content %}
<section class="auth-layout auth-layout-single">
    <div class="auth-panel form-panel">
        <p class="eyebrow">Get started</p>
        <h1>Create your GAILSPARTAN account</h1>
        <p class="muted">Your account keeps indexed documents and conversation history separate from other users.</p>
        <form method="post" action="{{ url_for('register') }}" class="stack-form">
            <div class="field-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" maxlength="80" required>
            </div>
            <div class="field-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="email" maxlength="255" required>
            </div>
            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>
            <button class="button button-primary" type="submit">Create account</button>
        </form>
        <p class="form-footer">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
</section>
{% endblock %}
